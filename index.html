<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Washbay">
  <title>Washbay Checks</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="badge">MC</span><span id="appTitle">Washbay Checks</span></div>
    <div id="netState" class="net"></div>
  </header>

  <!-- HOME -->
  <main id="home" class="screen">
    <section class="card">
      <label class="lbl" for="inspector">Inspector name</label>
      <input id="inspector" type="text" autocomplete="name" placeholder="Your full name">
    </section>

    <section id="freqCards"></section>

    <section class="card sync">
      <div class="row between">
        <div>
          <div class="h3">Sync to spreadsheet</div>
          <div id="syncSummary" class="muted small"></div>
        </div>
        <button id="syncBtn" class="btn secondary">Sync now</button>
      </div>
      <button id="signInBtn" class="btn primary block hidden">Sign in to Microsoft to sync</button>
      <div id="syncMsg" class="small"></div>
    </section>

    <section class="card">
      <div class="row between">
        <div class="h3">Recent checks on this device</div>
        <button id="exportBtn" class="btn link">Export CSV</button>
      </div>
      <ul id="history" class="history"></ul>
    </section>
    <p class="muted tiny center" id="versionInfo"></p>
  </main>

  <!-- CHECKLIST -->
  <main id="check" class="screen hidden">
    <div class="row between sticky-sub">
      <button id="backBtn" class="btn link">‹ Back</button>
      <div class="h2" id="checkTitle"></div>
      <span></span>
    </div>
    <p class="muted small center" id="checkMeta"></p>
    <form id="checkForm" novalidate>
      <div id="items"></div>
      <section class="card">
        <label class="lbl" for="generalNotes">General notes (optional)</label>
        <textarea id="generalNotes" rows="2" placeholder="Anything else to report"></textarea>
      </section>
      <div id="formError" class="error hidden"></div>
      <button type="submit" class="btn primary block big">Submit check</button>
      <p class="muted tiny center">Saved on this device first, then sent to the spreadsheet when you have signal.</p>
    </form>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="checklist.js"></script>
  <script src="lib/msal-browser.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
